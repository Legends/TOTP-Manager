name: Publish project website

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/images/readme/app.png'
      - 'docs/images/social/otp-harbor-social-preview.png'
      - 'TOTP.UI.Avalonia.Desktop/Assets/Icons/app-1024.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate website content
        shell: pwsh
        run: ./scripts/validation/Test-PublicWebsite.ps1

      - name: Assemble static website
        shell: bash
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/robots.txt site/sitemap.xml _site/
          cp docs/images/readme/app.png _site/assets/app.png
          cp docs/images/social/otp-harbor-social-preview.png _site/assets/social-preview.png
          cp TOTP.UI.Avalonia.Desktop/Assets/Icons/app-1024.png _site/assets/app-icon.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

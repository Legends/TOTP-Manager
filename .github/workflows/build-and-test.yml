name: Build, Test and Publish TOTP Manager App

on:
  push:
    branches: [master, 'release/1.x']
    tags:
      - 'v*'  # This triggers release publishing only when a tag is pushed
  pull_request:
    branches: [master, 'release/1.x']
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    env:
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      NETSPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
      NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
            NuGet.config

      - name: Restore with NuGet.config
        run: dotnet restore TOTP.sln --nologo --verbosity minimal --configfile NuGet.config --source https://api.nuget.org/v3/index.json

      - name: Build solution
        run: dotnet build --configuration Release --no-restore --nologo --verbosity minimal

      - name: Run fast tests (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          dotnet test --configuration Release --no-build --nologo --verbosity minimal `
            --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~IdleMonitoringBackgroundServiceTests&FullyQualifiedName!~UserActivityServiceTests"

      - name: Run full tests (push/tags)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet test --configuration Release --no-build --nologo --verbosity minimal `
            --logger "console;verbosity=minimal" `
            --results-directory TestResults `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none

      - name: Upload test diagnostics
        if: ${{ failure() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: TestResults
          if-no-files-found: ignore

  unix-file-security:
    name: Unix file security (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: |
            TOTP.Core/TOTP.Core.csproj
            TOTP.Platform.Linux/TOTP.Platform.Linux.csproj
            TOTP.Platform.MacOS/TOTP.Platform.MacOS.csproj
            TOTP.Platform.Unix/TOTP.Platform.Unix.csproj
            TOTP.Tests.Unix/TOTP.Tests.Unix.csproj
            TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
            TOTP.UI.Avalonia.Shared/TOTP.UI.Avalonia.Shared.csproj
            NuGet.config

      - name: Restore Unix security tests
        run: dotnet restore TOTP.Tests.Unix/TOTP.Tests.Unix.csproj --nologo --verbosity minimal --configfile NuGet.config

      - name: Run Unix security tests
        run: dotnet test TOTP.Tests.Unix/TOTP.Tests.Unix.csproj --configuration Release --no-restore --nologo --verbosity minimal

      - name: Restore Avalonia desktop host
        run: dotnet restore TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj --nologo --verbosity minimal --configfile NuGet.config

      - name: Build Avalonia desktop host
        run: dotnet build TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj --configuration Release --no-restore --nologo --verbosity minimal

  m3-package-probe:
    name: M3 package probe (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            rid: win-x64
            executable: TOTP.UI.Avalonia.Desktop.exe
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            rid: linux-x64
            executable: TOTP.UI.Avalonia.Desktop
          - name: macOS ARM64
            runner: macos-15
            rid: osx-arm64
            executable: TOTP.UI.Avalonia.Desktop
          - name: macOS x64
            runner: macos-15-intel
            rid: osx-x64
            executable: TOTP.UI.Avalonia.Desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: |
            TOTP.Camera.OpenCv/TOTP.Camera.OpenCv.csproj
            TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
            NuGet.config

      - name: Restore target package graph
        run: >-
          dotnet restore TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --runtime ${{ matrix.rid }}
          --nologo
          --verbosity minimal
          --configfile NuGet.config

      - name: Publish framework-dependent M3 package
        run: >-
          dotnet publish TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          --no-restore
          --nologo
          --verbosity minimal
          --output m3-package

      - name: Execute packaged native-runtime probe
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "m3-package/${{ matrix.executable }}"
          if ($IsWindows) {
            $process = Start-Process -FilePath $executable -ArgumentList "--m3-native-probe" -Wait -PassThru -WindowStyle Hidden
            $probeExitCode = $process.ExitCode
          }
          else {
            & $executable --m3-native-probe
            $probeExitCode = $LASTEXITCODE
          }
          if ($probeExitCode -ne 0) {
            throw "Packaged OpenCV native-runtime probe failed with exit code $probeExitCode."
          }

          $packageBytes = (Get-ChildItem m3-package -File -Recurse | Measure-Object Length -Sum).Sum
          "M3_PACKAGE_BYTES=$packageBytes" >> $env:GITHUB_ENV
          "### ${{ matrix.name }}`n`nPackage bytes: $packageBytes" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload M3 validation package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v6
        with:
          name: m3-${{ matrix.rid }}-${{ github.sha }}
          path: m3-package
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [build-test, unix-file-security, m3-package-probe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      NETSPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
      NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
            NuGet.config

      - name: Restore dependencies
        run: dotnet restore TOTP/TOTP.UI.WPF.csproj --nologo --verbosity minimal --configfile NuGet.config --source https://api.nuget.org/v3/index.json -r win-x64

      - name: Compute release version metadata
        id: versioning
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-rc(?<rc>\d+))?$') {
            throw "Release tag '$tag' does not match expected format v<major>.<minor>.<patch>[-rc<nr>]."
          }

          $baseVersion = $Matches.version
          $releaseVersion = if ($Matches.rc) { "$baseVersion-rc$($Matches.rc)" } else { $baseVersion }
          $fileVersion = if ($Matches.rc) { "$baseVersion.$($Matches.rc)" } else { "$baseVersion.0" }

          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Release version: $releaseVersion"
          Write-Host "File version: $fileVersion"

      - name: Determine whether this tag should be latest
        id: latest_release
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          if ($currentTag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:-rc(?<rc>\d+))?$') {
            throw "Release tag '$currentTag' does not match expected format v<major>.<minor>.<patch>[-rc<nr>]."
          }

          $tagLines = git ls-remote --tags --refs origin "v*"
          if (-not $tagLines) {
            throw "Could not resolve release tags from origin."
          }

          $releaseTags = foreach ($line in $tagLines) {
            $parts = $line -split '\s+'
            if ($parts.Count -lt 2) {
              continue
            }

            $ref = $parts[1]
            if ($ref -notmatch '^refs/tags/(?<tag>v\d+\.\d+\.\d+(?:-rc\d+)?)$') {
              continue
            }

            $tag = $Matches.tag
            if ($tag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:-rc(?<rc>\d+))?$') {
              continue
            }

            [PSCustomObject]@{
              Tag = $tag
              Major = [int]$Matches.major
              Minor = [int]$Matches.minor
              Patch = [int]$Matches.patch
              Stable = if ($Matches.rc) { 0 } else { 1 }
              Rc = if ($Matches.rc) { [int]$Matches.rc } else { 0 }
            }
          }

          $highestTag = $releaseTags |
            Sort-Object Major, Minor, Patch, Stable, Rc |
            Select-Object -Last 1 -ExpandProperty Tag

          if ([string]::IsNullOrWhiteSpace($highestTag)) {
            throw "Could not determine the highest release tag."
          }

          $makeLatest = if ($currentTag -eq $highestTag) { 'true' } else { 'false' }
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT

          Write-Host "Current tag: $currentTag"
          Write-Host "Highest tag: $highestTag"
          Write-Host "Mark release as latest: $makeLatest"

      - name: Publish WPF app (fast startup)
        run: |
          dotnet publish TOTP/TOTP.UI.WPF.csproj `
            --configuration Release `
            --no-restore `
            --nologo `
            --verbosity minimal `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:Version=${{ steps.versioning.outputs.release_version }} `
            -p:InformationalVersion=${{ steps.versioning.outputs.release_version }} `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:FileVersion=${{ steps.versioning.outputs.file_version }} `
            -p:AssemblyVersion=${{ steps.versioning.outputs.file_version }} `
            --output publish-fast

      - name: Publish WPF app (portable single-file)
        run: |
          dotnet publish TOTP/TOTP.UI.WPF.csproj `
            --configuration Release `
            --no-restore `
            --nologo `
            --verbosity minimal `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:Version=${{ steps.versioning.outputs.release_version }} `
            -p:InformationalVersion=${{ steps.versioning.outputs.release_version }} `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:FileVersion=${{ steps.versioning.outputs.file_version }} `
            -p:AssemblyVersion=${{ steps.versioning.outputs.file_version }} `
            --output publish-portable

      - name: Cache .NET global tools
        id: cache-dotnet-tools
        uses: actions/cache@v5
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-netsparkle-appcastgenerator-v2

      - name: Sign published executable
        if: ${{ env.SIGNING_CERT_BASE64 != '' && env.SIGNING_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          ./TOTP/Properties/Signing/Sign-App.ps1 -ExePath ./publish-fast/TOTP.UI.WPF.exe
          ./TOTP/Properties/Signing/Sign-App.ps1 -ExePath ./publish-portable/TOTP.UI.WPF.exe

      - name: Signing skipped notice
        if: ${{ env.SIGNING_CERT_BASE64 == '' || env.SIGNING_CERT_PASSWORD == '' }}
        run: |
          echo "Signing skipped: SIGNING_CERT_BASE64 or SIGNING_CERT_PASSWORD is not configured."

      - name: Compress release artifacts
        run: |
          Compress-Archive -Path publish-fast\* -DestinationPath TOTP-Manager-fast.zip
          Compress-Archive -Path publish-portable\* -DestinationPath TOTP-Manager-portable.zip

      - name: Install NetSparkle appcast tool
        if: ${{ env.NETSPARKLE_PUBLIC_KEY != '' && env.NETSPARKLE_PRIVATE_KEY != '' }}
        run: |
          dotnet tool list --global | findstr /I "NetSparkleUpdater.Tools.AppCastGenerator" >nul
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --verbosity minimal
          }

      - name: Generate appcast for auto-update
        if: ${{ env.NETSPARKLE_PUBLIC_KEY != '' && env.NETSPARKLE_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          $keyDir = Join-Path $env:RUNNER_TEMP "netsparkle-keys"
          New-Item -ItemType Directory -Path $keyDir -Force | Out-Null
          $pubPath = Join-Path $keyDir "NetSparkle_Ed25519.pub"
          $privPath = Join-Path $keyDir "NetSparkle_Ed25519.priv"
          Set-Content -Path $pubPath -Value $env:NETSPARKLE_PUBLIC_KEY -Encoding ASCII
          Set-Content -Path $privPath -Value $env:NETSPARKLE_PRIVATE_KEY -Encoding ASCII
          ./scripts/release/Generate-Appcast.ps1 `
            -ReleaseFolder "./publish-fast" `
            -BaseDownloadUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" `
            -PrivateKeyPath $privPath `
            -PublicKeyPath $pubPath `
            -MainArtifactName "TOTP-Manager-fast.zip" `
            -MainArtifactPath "./TOTP-Manager-fast.zip" `
            -FileVersion "${{ steps.versioning.outputs.file_version }}" `
            -DisplayVersion "${{ steps.versioning.outputs.release_version }}"

      - name: Validate generated appcast versions
        if: ${{ env.NETSPARKLE_PUBLIC_KEY != '' && env.NETSPARKLE_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          $appcastPath = "./publish-fast/appcast.xml"
          if (-not (Test-Path $appcastPath)) {
            throw "Generated appcast not found: $appcastPath"
          }

          [xml]$xml = Get-Content -Path $appcastPath -Raw
          $sparkleNs = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("sparkle", $sparkleNs)

          $item = $xml.SelectSingleNode("/rss/channel/item")
          $enclosure = $item.SelectSingleNode("enclosure")
          $itemVersion = $item.SelectSingleNode("sparkle:version", $ns).InnerText
          $shortVersion = $item.SelectSingleNode("sparkle:shortVersionString", $ns).InnerText
          $enclosureVersion = $enclosure.GetAttribute("version", $sparkleNs)
          $enclosureShortVersion = $enclosure.GetAttribute("shortVersionString", $sparkleNs)

          if ($itemVersion -ne "${{ steps.versioning.outputs.file_version }}") {
            throw "appcast sparkle:version mismatch. Expected '${{ steps.versioning.outputs.file_version }}' but got '$itemVersion'."
          }

          if ($enclosureVersion -ne "${{ steps.versioning.outputs.file_version }}") {
            throw "appcast enclosure sparkle:version mismatch. Expected '${{ steps.versioning.outputs.file_version }}' but got '$enclosureVersion'."
          }

          if ($shortVersion -ne "${{ steps.versioning.outputs.release_version }}") {
            throw "appcast sparkle:shortVersionString mismatch. Expected '${{ steps.versioning.outputs.release_version }}' but got '$shortVersion'."
          }

          if ($enclosureShortVersion -ne "${{ steps.versioning.outputs.release_version }}") {
            throw "appcast enclosure sparkle:shortVersionString mismatch. Expected '${{ steps.versioning.outputs.release_version }}' but got '$enclosureShortVersion'."
          }

          Write-Host "Appcast version fields validated."

      - name: Appcast generation skipped notice
        if: ${{ env.NETSPARKLE_PUBLIC_KEY == '' || env.NETSPARKLE_PRIVATE_KEY == '' }}
        run: |
          echo "Appcast generation skipped: NETSPARKLE_PUBLIC_KEY or NETSPARKLE_PRIVATE_KEY is not configured."

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          make_latest: ${{ steps.latest_release.outputs.make_latest }}
          files: |
            TOTP-Manager-fast.zip
            TOTP-Manager-portable.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload auto-update assets to GitHub Release
        if: ${{ env.NETSPARKLE_PUBLIC_KEY != '' && env.NETSPARKLE_PRIVATE_KEY != '' }}
        uses: softprops/action-gh-release@v3.0.1
        with:
          make_latest: ${{ steps.latest_release.outputs.make_latest }}
          files: |
            publish-fast/TOTP.UI.WPF.exe
            publish-fast/appcast.xml
            publish-fast/appcast.xml.signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
